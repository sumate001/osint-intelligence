# Shared location blocks — included by both HTTP and HTTPS server blocks

# API — FastAPI backend
location /api/ {
    proxy_pass         http://api;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;  # allow long LLM calls
}

# API docs (Swagger / ReDoc)
location ~ ^/(docs|redoc|openapi\.json)$ {
    proxy_pass         http://api;
    proxy_set_header   Host $host;
}

# Health endpoint (unauthenticated)
location /health {
    proxy_pass http://api;
}

# WebSocket — investigation scan + simulation progress
location /ws/ {
    proxy_pass             http://api;
    proxy_http_version     1.1;
    proxy_set_header       Upgrade           $http_upgrade;
    proxy_set_header       Connection        $connection_upgrade;
    proxy_set_header       Host              $host;
    proxy_read_timeout     3600s;
    proxy_send_timeout     3600s;
}

# Server-Sent Events — notification stream
location /api/v1/events {
    proxy_pass         http://api;
    proxy_set_header   Host $host;
    proxy_set_header   X-Accel-Buffering no;  # disable nginx buffering for SSE
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
}

# Next.js hashed build output — the filename changes when the content does.
location /_next/static/ {
    proxy_pass         http://frontend;
    proxy_set_header   Host $host;
    expires            1y;
    add_header         Cache-Control "public, immutable";
}

# Frontend — Next.js (everything else)
#
# The HTML must not be cached. It is the only thing that names which hashed
# bundle to load, and those are cached for a year, so a browser holding a stale
# document goes on loading the bundle that document names — every deploy then
# reaches nobody who has opened the app before, and it reads as the change never
# having been made. Next.js sends `s-maxage=31536000` here, which is meant for a
# CDN in front of it and is the wrong instruction for the browser.
location / {
    proxy_pass         http://frontend;
    proxy_hide_header  Cache-Control;
    add_header         Cache-Control "no-cache, must-revalidate";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
